name: Control Center checks

on:
  pull_request:
    paths:
      - 'main.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q main.py tests
      - name: Run tests
        run: python -m pytest -q
